<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Scan ID Sampel</title>


<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>


<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f6f9;
  color: #1f2937;
}

.header {
  background: #0078bd;
  color: white;
  padding: 18px;
  text-align: center;
}

.header h2 {
  margin: 0;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 16px;
}

.card {
  background: white;
  padding: 16px;
  border-radius: 16px;
  margin-bottom: 16px;

  box-shadow:
    0 4px 16px
    rgba(0,0,0,0.10);
}

video {
  width: 100%;
  border-radius: 12px;
  background: black;
}

canvas {
  display: none;
}

.status {
  margin-top: 12px;
  padding: 12px;
  background: #e8f4fc;
  border-radius: 10px;
  text-align: center;
  font-weight: bold;
}

.label {
  margin-top: 14px;
  font-size: 12px;
  color: #6b7280;
}

.value {
  margin-top: 4px;
  font-size: 18px;
  font-weight: bold;
}

.result-card {
  display: none;
}

button {
  width: 100%;
  border: none;
  padding: 14px;
  margin-top: 12px;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.primary {
  background: #0078bd;
  color: white;
}

.secondary {
  background: #e5e7eb;
}

.success {
  background: #dcfce7;
  color: #166534;
}

.error {
  background: #fee2e2;
  color: #991b1b;
}

#message {
  display: none;
  margin-top: 12px;
  padding: 12px;
  border-radius: 10px;
  text-align: center;
}

textarea {
  width: 100%;
  min-height: 120px;
  margin-top: 8px;
  padding: 10px;
  border-radius: 8px;
}

</style>

</head>


<body>


<div class="header">
  <h2>📷 Scan ID Sampel</h2>
</div>


<div class="container">


<div class="card">


  <video
    id="video"
    autoplay
    playsinline
  ></video>


  <canvas id="canvas"></canvas>


  <div
    id="status"
    class="status"
  >
    Tekan Aktifkan Kamera
  </div>


  <button
    class="primary"
    onclick="startCamera()"
  >
    📷 Aktifkan Kamera
  </button>


  <button
    class="primary"
    onclick="captureAndOCR()"
  >
    📸 Ambil Gambar & Baca Teks
  </button>


</div>



<div
  id="resultCard"
  class="card result-card"
>


  <div class="label">
    ID Sampel
  </div>

  <div
    id="idSampel"
    class="value"
  >
    -
  </div>


  <div class="label">
    Tanggal
  </div>

  <div
    id="tanggal"
    class="value"
  >
    -
  </div>


  <div class="label">
    Posisi
  </div>

  <div
    id="posisi"
    class="value"
  >
    -
  </div>


  <div class="label">
    Pengujian
  </div>

  <div
    id="pengujian"
    class="value"
  >
    -
  </div>


  <div class="label">
    Raw OCR
  </div>

  <textarea
    id="rawText"
  ></textarea>


  <button
    class="primary"
    onclick="saveData()"
  >
    💾 Simpan
  </button>


  <button
    class="secondary"
    onclick="resetScan()"
  >
    🔄 Scan Berikutnya
  </button>


  <div id="message"></div>


</div>


</div>



<script>


let stream = null;

let hasilData = null;



async function startCamera() {

  const status =
    document.getElementById("status");


  try {

    status.innerHTML =
      "Membuka kamera...";


    if (stream) {

      stream.getTracks().forEach(
        track => track.stop()
      );

    }


    stream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {
            facingMode: {
              ideal: "environment"
            }
          },

          audio: false

        });


    const video =
      document.getElementById(
        "video"
      );


    video.srcObject =
      stream;


    status.innerHTML =
      "📷 Kamera aktif — arahkan ke label sampel";


  } catch (error) {

    console.error(error);

    status.innerHTML =
      "❌ Kamera gagal: " +
      error.message;

  }

}



async function captureAndOCR() {

  const status =
    document.getElementById("status");


  const video =
    document.getElementById("video");


  const canvas =
    document.getElementById("canvas");


  if (!stream) {

    status.innerHTML =
      "❌ Aktifkan kamera terlebih dahulu";

    return;
  }


  status.innerHTML =
    "📸 Mengambil gambar...";


  const width =
    video.videoWidth;


  const height =
    video.videoHeight;


  canvas.width =
    width;


  canvas.height =
    height;


  const ctx =
    canvas.getContext("2d");


  ctx.drawImage(
    video,
    0,
    0,
    width,
    height
  );


  status.innerHTML =
    "🔎 Membaca teks...";


  try {

    const result =
      await Tesseract.recognize(
        canvas,
        "eng",
        {
          logger: function(info) {

            if (
              info.status ===
              "recognizing text"
            ) {

              const progress =
                Math.round(
                  info.progress * 100
                );

              status.innerHTML =
                "🔎 Membaca teks " +
                progress +
                "%";

            }

          }
        }
      );


    const text =
      result.data.text;


    console.log(
      "OCR:",
      text
    );


    parseText(text);


    status.innerHTML =
      "✅ Teks berhasil dibaca";


  } catch (error) {

    console.error(error);


    status.innerHTML =
      "❌ OCR gagal: " +
      error.message;

  }

}



function parseText(text) {


  const cleaned =
    text
      .replace(/\r/g, "")
      .trim();


  const lines =
    cleaned
      .split("\n")
      .map(
        line => line.trim()
      )
      .filter(Boolean);


  let idSampel =
    "";


  let tanggal =
    "";


  let posisi =
    "";


  let pengujian =
    "";


  /*
   * ID Sampel
   * contoh:
   * 260933-1002-28853
   */

  const idRegex =
    /\b\d{6}-\d{4}-\d{5}\b/;


  const idMatch =
    cleaned.match(
      idRegex
    );


  if (idMatch) {

    idSampel =
      idMatch[0];

  }



  /*
   * Tanggal
   * contoh:
   * 23-08-2026
   */

  const tanggalRegex =
    /\b\d{2}[-\/]\d{2}[-\/]\d{4}\b/;


  const tanggalMatch =
    cleaned.match(
      tanggalRegex
    );


  if (tanggalMatch) {

    tanggal =
      tanggalMatch[0]
        .replace(/\//g, "-");

  }



  /*
   * Posisi
   */

  const posisiKnown = [

    "BOTTOM MAINTANK",

    "TOP MAINTANK",

    "MIDDLE MAINTANK",

    "OLTC",

    "BUCHHOLZ",

    "RADIATOR",

    "CONSERVATOR"

  ];


  for (
    const item of posisiKnown
  ) {

    if (
      cleaned
        .toUpperCase()
        .includes(item)
    ) {

      posisi =
        item;

      break;

    }

  }



  /*
   * Jenis pengujian
   */

  const upper =
    cleaned.toUpperCase();


  if (
    upper.includes(
      "DISSOLVED GAS ANALYSIS"
    ) ||
    upper.includes("(DGA)")
  ) {

    pengujian =
      "Dissolved Gas Analysis (DGA)";

  }


  else if (
    upper.includes(
      "BREAKDOWN VOLTAGE"
    ) ||
    upper.includes("BDV")
  ) {

    pengujian =
      "Breakdown Voltage (BDV)";

  }


  else if (
    upper.includes("FURAN")
  ) {

    pengujian =
      "Furan";

  }


  else if (
    upper.includes(
      "INTERFACIAL TENSION"
    ) ||
    upper.includes("IFT")
  ) {

    pengujian =
      "Interfacial Tension (IFT)";

  }



  hasilData = {

    idSampel:
      idSampel,

    tanggal:
      tanggal,

    posisi:
      posisi,

    pengujian:
      pengujian,

    rawText:
      cleaned

  };


  document.getElementById(
    "idSampel"
  ).innerText =
    idSampel || "Tidak terbaca";


  document.getElementById(
    "tanggal"
  ).innerText =
    tanggal || "Tidak terbaca";


  document.getElementById(
    "posisi"
  ).innerText =
    posisi || "Tidak terbaca";


  document.getElementById(
    "pengujian"
  ).innerText =
    pengujian || "Tidak terbaca";


  document.getElementById(
    "rawText"
  ).value =
    cleaned;


  document.getElementById(
    "resultCard"
  ).style.display =
    "block";

}



async function saveData() {


  const message =
    document.getElementById(
      "message"
    );


  if (!hasilData) {

    return;

  }


  /*
   * Ambil raw text terbaru
   * jika diedit manual
   */

  hasilData.rawText =
    document.getElementById(
      "rawText"
    ).value;


  message.style.display =
    "block";


  message.className =
    "";


  message.innerHTML =
    "Menyimpan...";


  try {


    const response =
      await fetch(
        "/api/save",
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify(
              hasilData
            )

        }
      );


    const result =
      await response.json();


    if (result.success) {


      message.className =
        "success";


      message.innerHTML =
        "✅ Data berhasil disimpan";


    } else {


      message.className =
        "error";


      message.innerHTML =
        "❌ " +
        result.message;

    }


  } catch (error) {


    message.className =
      "error";


    message.innerHTML =
      "❌ Gagal menyimpan";


  }

}



function resetScan() {


  hasilData =
    null;


  document.getElementById(
    "resultCard"
  ).style.display =
    "none";


  document.getElementById(
    "message"
  ).style.display =
    "none";


  document.getElementById(
    "status"
  ).innerHTML =
    "📷 Kamera siap — arahkan label berikutnya";

}


</script>


</body>

</html>
