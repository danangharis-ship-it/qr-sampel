<script>

const API_URL = "/api/sample";

let scanner = null;
let scannerAktif = false;
let currentData = null;


window.addEventListener("load", function () {

  document.getElementById("status").innerHTML =
    "Tekan tombol untuk mengaktifkan kamera";

});


async function startScanner() {

  const status =
    document.getElementById("status");

  try {

    status.innerHTML =
      "Meminta izin kamera...";


    // Cek apakah browser mendukung kamera
    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "Browser tidak mendukung akses kamera"
      );

    }


    // Tes permission kamera
    const testStream =
      await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: false
      });


    // Setelah permission berhasil, hentikan test stream
    testStream.getTracks().forEach(
      track => track.stop()
    );


    status.innerHTML =
      "Kamera ditemukan, membuka scanner...";


    if (scanner) {

      try {
        await scanner.clear();
      } catch (e) {}

    }


    scanner =
      new Html5Qrcode("reader");


    const config = {

      fps: 10,

      qrbox: function(
        viewfinderWidth,
        viewfinderHeight
      ) {

        const ukuran =
          Math.floor(
            Math.min(
              viewfinderWidth,
              viewfinderHeight
            ) * 0.7
          );

        return {
          width: ukuran,
          height: ukuran
        };

      }

    };


    await scanner.start(

      {
        facingMode: {
          ideal: "environment"
        }
      },

      config,

      async function(decodedText) {

        if (!scannerAktif) {
          return;
        }

        scannerAktif = false;


        status.innerHTML =
          "✅ QR berhasil dibaca";


        try {
          await scanner.stop();
        } catch (e) {}


        await cariSampel(
          decodedText
        );

      },

      function(errorMessage) {

        // Tidak perlu tampilkan error setiap frame

      }

    );


    scannerAktif =
      true;


    status.innerHTML =
      "📷 Kamera aktif — arahkan QR Code";


  }

  catch (error) {

    console.error(
      "CAMERA ERROR:",
      error
    );


    status.innerHTML =
      "❌ Kamera gagal: " +
      (
        error.message ||
        error
      );

  }

}



async function cariSampel(uuid) {

  const status =
    document.getElementById("status");


  status.innerHTML =
    "🔍 Mencari data sampel...";


  document.getElementById(
    "uuid"
  ).innerText =
    uuid;


  try {

    const url =
      API_URL +
      "?uuid=" +
      encodeURIComponent(uuid);


    const response =
      await fetch(url);


    const result =
      await response.json();


    if (!result.success) {

      status.innerHTML =
        "❌ " +
        (
          result.message ||
          "Data tidak ditemukan"
        );

      return;

    }


    currentData =
      result.data;


    document.getElementById(
      "uuid"
    ).innerText =
      currentData.uuid || "-";


    document.getElementById(
      "idSampel"
    ).innerText =
      currentData.idSampel || "-";


    document.getElementById(
      "tanggal"
    ).innerText =
      currentData.tanggal || "-";


    document.getElementById(
      "posisi"
    ).innerText =
      currentData.posisi || "-";


    document.getElementById(
      "pengujian"
    ).innerText =
      currentData.pengujian || "-";


    document.getElementById(
      "resultCard"
    ).style.display =
      "block";


    status.innerHTML =
      "✅ Sampel ditemukan";

  }

  catch(error) {

    console.error(
      "API ERROR:",
      error
    );


    status.innerHTML =
      "❌ Gagal mengambil data: " +
      (
        error.message ||
        error
      );

  }

}



async function scanLagi() {

  currentData =
    null;


  scannerAktif =
    false;


  document.getElementById(
    "resultCard"
  ).style.display =
    "none";


  document.getElementById(
    "message"
  ).style.display =
    "none";


  document.getElementById(
    "status"
  ).innerHTML =
    "Tekan tombol untuk mengaktifkan kamera";

}



</script>
