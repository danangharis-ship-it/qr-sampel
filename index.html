<script>

/* ==========================================
   GLOBAL
========================================== */

let stream = null;
let prosesOCR = false;


/* ==========================================
   CAMERA
========================================== */

async function startCamera() {

  const status =
    document.getElementById("status");

  try {

    status.innerHTML =
      "Membuka kamera...";


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "Browser tidak mendukung kamera"
      );

    }


    if (stream) {

      stream
        .getTracks()
        .forEach(track => track.stop());

    }


    /*
      Minta resolusi cukup tinggi.

      Resolusi tinggi sangat penting karena
      teks label relatif kecil.
    */

    const constraints = {

  audio:false,

  video:{

    facingMode:{
      exact:"environment"
    },

    width:{
      ideal:1280
    },

    height:{
      ideal:720
    },

    zoom:2

  }

};


    stream =
      await navigator.mediaDevices
        .getUserMedia(constraints);


    const video =
      document.getElementById("video");


    video.srcObject =
      stream;


    await video.play();


    status.innerHTML =
      "📷 Kamera aktif — arahkan teks label ke kotak hijau";


  } catch(error) {

    console.error(error);

    status.innerHTML =
      "❌ Kamera gagal: " +
      (error.message || error);

  }

}


/* ==========================================
   CAPTURE + OCR
========================================== */

async function captureAndOCR() {

  if (prosesOCR) {
    return;
  }


  const video =
    document.getElementById("video");

  const status =
    document.getElementById("status");

  const button =
    document.getElementById("btnCapture");


  if (
    !stream ||
    !video.videoWidth ||
    !video.videoHeight
  ) {

    status.innerHTML =
      "❌ Aktifkan kamera terlebih dahulu";

    return;

  }


  prosesOCR = true;
  button.disabled = true;


  try {

    status.innerHTML =
      "📸 Mengambil gambar...";


    const sourceCanvas =
      document.getElementById(
        "captureCanvas"
      );


    const sourceCtx =
      sourceCanvas.getContext(
        "2d",
        {
          willReadFrequently: true
        }
      );


    /*
      Capture resolusi kamera ASLI.
      Jangan memakai ukuran CSS video.
    */

    sourceCanvas.width =
      video.videoWidth;

    sourceCanvas.height =
      video.videoHeight;


    sourceCtx.drawImage(
      video,
      0,
      0,
      sourceCanvas.width,
      sourceCanvas.height
    );


    /*
      =============================
      CROP AREA TEKS
      =============================

      Mengambil area tengah-horizontal
      dan bagian bawah gambar.

      QR di bagian atas sengaja dibuang.
    */


    // Sesuaikan dengan kotak hijau kamera

const cropX =
  Math.round(
    sourceCanvas.width * 0.05
  );


const cropY =
  Math.round(
    sourceCanvas.height * 0.20
  );


const cropWidth =
  Math.round(
    sourceCanvas.width * 0.90
  );


const cropHeight =
  Math.round(
    sourceCanvas.height * 0.35
  );

    /*
      UPSCALE 3X
      untuk membantu membaca font kecil
    */

    const scale = 3;


    const processCanvas =
      document.getElementById(
        "processCanvas"
      );


    processCanvas.width =
      cropWidth * scale;

    processCanvas.height =
      cropHeight * scale;


    const processCtx =
      processCanvas.getContext(
        "2d",
        {
          willReadFrequently: true
        }
      );


    /*
      Gunakan smoothing bagus ketika diperbesar
    */

    processCtx.imageSmoothingEnabled =
      true;

    processCtx.imageSmoothingQuality =
      "high";


    processCtx.drawImage(

      sourceCanvas,

      cropX,
      cropY,
      cropWidth,
      cropHeight,

      0,
      0,
      processCanvas.width,
      processCanvas.height

    );


    /*
      =============================
      PREPROCESSING
      grayscale + contrast
      =============================
    */

    preprocessImage(
      processCtx,
      processCanvas.width,
      processCanvas.height
    );
    
// preprocessImage(
//   processCtx,
//   processCanvas.width,
//   processCanvas.height
// );

    /*
      Preview area sebenarnya yang
      dibaca oleh OCR.
    */

    const preview =
      document.getElementById(
        "ocrPreview"
      );


    preview.src =
      processCanvas.toDataURL(
        "image/jpeg",
        0.95
      );


    preview.style.display =
      "block";


    status.innerHTML =
      "🔎 Menyiapkan OCR...";


    /*
      OCR
    */

    const result =
      await Tesseract.recognize(

        processCanvas,

        "eng",

        {

          logger: info => {

            if (
              info.status ===
              "recognizing text"
            ) {

              const persen =
                Math.round(
                  info.progress * 100
                );


              status.innerHTML =
                "🔎 Membaca teks " +
                persen +
                "%";

            }

          }

        }

      );


    const raw =
      result.data.text || "";


    console.log(
      "RAW OCR:",
      raw
    );


    parseOCR(raw);


    status.innerHTML =
      "✅ Teks berhasil diproses";


  } catch(error) {

    console.error(error);

    status.innerHTML =
      "❌ OCR gagal: " +
      (error.message || error);

  }


  prosesOCR = false;
  button.disabled = false;

}


/* ==========================================
   IMAGE PREPROCESSING
========================================== */

function preprocessImage(
  ctx,
  width,
  height
) {

  const imageData =
    ctx.getImageData(
      0,
      0,
      width,
      height
    );


  const pixels =
    imageData.data;


  /*
    Threshold sederhana.

    Background terang -> putih
    teks gelap -> hitam.
  */

  for (
    let i = 0;
    i < pixels.length;
    i += 4
  ) {

    const r =
      pixels[i];

    const g =
      pixels[i + 1];

    const b =
      pixels[i + 2];


    const gray =
      (
        0.299 * r +
        0.587 * g +
        0.114 * b
      );


    /*
      Adaptive-ish threshold sederhana
      yang cocok untuk label putih.
    */

    let value;


   if (gray > 165) {

  value = 255;

} else {

  value = 0;

}


    pixels[i] =
      value;

    pixels[i + 1] =
      value;

    pixels[i + 2] =
      value;

  }


  ctx.putImageData(
    imageData,
    0,
    0
  );

}


/* ==========================================
   OCR PARSER
========================================== */

function parseOCR(text) {

  let cleaned =
    String(text || "")

      .replace(/\r/g, "\n")

      .replace(/[|]/g, "I")

      .replace(/[–—]/g, "-")

      .replace(/\s+/g, " ")

      .trim();


  /*
    Kita juga mempertahankan line breaks
    untuk raw OCR.
  */

  const rawClean =
    String(text || "")
      .replace(/\r/g, "")
      .trim();


  document.getElementById(
    "rawText"
  ).value =
    rawClean;


  /*
    =====================================
    ID SAMPEL
    =====================================

    Target:
    260933-1002-28853

    dibuat sedikit toleran terhadap
    spasi hasil OCR.
  */

  let idSampel = "";


  let idMatch =
    cleaned.match(
      /\b\d{6}\s*-\s*\d{4}\s*-\s*\d{5}\b/
    );


  if (idMatch) {

    idSampel =
      idMatch[0]
        .replace(/\s/g, "");

  }


  /*
    =====================================
    TANGGAL
    =====================================
  */

  let tanggal = "";


  let dateMatch =
    cleaned.match(
      /\b\d{2}\s*[-\/.]\s*\d{2}\s*[-\/.]\s*\d{4}\b/
    );


  if (dateMatch) {

    tanggal =
      dateMatch[0]

        .replace(/\s/g, "")

        .replace(/[\/.]/g, "-");

  }


  /*
    =====================================
    POSISI
    =====================================
  */

  let posisi = "";


  const upper =
    cleaned.toUpperCase();


  const posisiList = [

    "BOTTOM MAINTANK",

    "BOTTOM MAIN TANK",

    "TOP MAINTANK",

    "TOP MAIN TANK",

    "MIDDLE MAINTANK",

    "MIDDLE MAIN TANK",

    "OLTC",

    "BUCHHOLZ",

    "CONSERVATOR",

    "RADIATOR"

  ];


  for (
    const item of posisiList
  ) {

    if (
      upper.includes(item)
    ) {

      posisi =
        item
          .replace(
            "MAIN TANK",
            "MAINTANK"
          );

      break;

    }

  }


  /*
    Bila OCR hanya mendapatkan kata
    BOTTOM + MAINTANK secara terpisah.
  */

  if (
    !posisi &&
    upper.includes("BOTTOM") &&
    (
      upper.includes("MAINTANK") ||
      upper.includes("MAIN TANK")
    )
  ) {

    posisi =
      "BOTTOM MAINTANK";

  }


  /*
    =====================================
    PENGUJIAN
    =====================================
  */

  let pengujian = "";


  if (

    upper.includes(
      "DISSOLVED GAS"
    )

    ||

    upper.includes(
      "GAS ANALYSIS"
    )

    ||

    upper.includes(
      "DGA"
    )

  ) {

    pengujian =
      "Dissolved Gas Analysis (DGA)";

  }


  else if (

    upper.includes(
      "BREAKDOWN"
    )

    ||

    upper.includes(
      "BDV"
    )

  ) {

    pengujian =
      "Breakdown Voltage (BDV)";

  }


  else if (

    upper.includes(
      "FURAN"
    )

  ) {

    pengujian =
      "Furan";

  }


  else if (

    upper.includes(
      "INTERFACIAL"
    )

    ||

    upper.includes(
      "IFT"
    )

  ) {

    pengujian =
      "Interfacial Tension (IFT)";

  }


  /*
    OUTPUT KE FORM
  */

  document.getElementById(
    "idSampel"
  ).value =
    idSampel;


  document.getElementById(
    "tanggal"
  ).value =
    tanggal;


  document.getElementById(
    "posisi"
  ).value =
    posisi;


  document.getElementById(
    "pengujian"
  ).value =
    pengujian;


  document.getElementById(
    "resultCard"
  ).style.display =
    "block";


  /*
    Scroll otomatis ke hasil
  */

  document.getElementById(
    "resultCard"
  ).scrollIntoView({

    behavior: "smooth",

    block: "start"

  });

}


/* ==========================================
   SAVE
========================================== */

async function saveData() {

  const message =
    document.getElementById(
      "message"
    );


  const btn =
    document.getElementById(
      "btnSave"
    );


  const data = {


userID:
currentUser.id,


user:
currentUser.nama,


role:
currentUser.role,


idSampel:
document
.getElementById(
"idSampel"
)
.value,


tanggal:
document
.getElementById(
"tanggal"
)
.value,


posisi:
document
.getElementById(
"posisi"
)
.value,


pengujian:
document
.getElementById(
"pengujian"
)
.value

};


  if (!data.idSampel) {

    message.style.display =
      "block";

    message.className =
      "error";

    message.innerHTML =
      "❌ ID Sampel kosong";

    return;

  }


  try {

    btn.disabled = true;


    message.style.display =
      "block";

    message.className = "";

    message.innerHTML =
      "⏳ Menyimpan ke Google Sheet...";


    const response =
      await fetch(

        "/api/save",

        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify(data)

        }

      );


    const text =
      await response.text();


    console.log(
      "SAVE RESPONSE:",
      text
    );


    let result;


    try {

      result =
        JSON.parse(text);

    }

    catch(error) {

      throw new Error(
        "Server tidak mengembalikan JSON: " +
        text.substring(0, 150)
      );

    }


    if (!result.success) {

      let pesan =
        result.message ||
        "Gagal menyimpan";


      if (result.detail) {

        pesan +=
          " | " +
          result.detail.substring(
            0,
            150
          );

      }


      throw new Error(pesan);

    }


    message.className =
      "success";


    message.innerHTML =
      "✅ Data berhasil disimpan ke Google Sheet";


  }

  catch(error) {

    console.error(error);


    message.className =
      "error";


    message.innerHTML =
      "❌ Gagal menyimpan: " +
      error.message;

  }


  btn.disabled =
    false;

}

  });

}

  let currentUser = "";


function loginUser(){


const value =
document
.getElementById(
"userSelect"
)
.value;



const user =
JSON.parse(
value
);



currentUser =
user;



localStorage.setItem(

"operator",

JSON.stringify(
user
)

);



document
.getElementById(
"loginCard"
)
.style.display=
"none";



document
.getElementById(
"userInfo"
)
.innerHTML =

"👤 "
+
user.nama
+
" ("
+
user.role
+
")";


}



window.onload = function() {

  const savedUser =
    localStorage.getItem(
      "operator"
    );


  if (savedUser) {

    try {

      currentUser =
        JSON.parse(
          savedUser
        );


      document
        .getElementById(
          "loginCard"
        )
        .style.display =
        "none";


      document
        .getElementById(
          "userInfo"
        )
        .innerHTML =
          "👤 Operator: <b>" +
          currentUser.nama +
          "</b> (" +
          currentUser.role +
          ")";


    } catch(error) {

      localStorage.removeItem(
        "operator"
      );

    }

  }


  loadUsers();

};

  function logoutUser(){

    localStorage.removeItem(
        "operator"
    );


    currentUser = "";


    document
    .getElementById(
        "loginCard"
    )
    .style.display =
    "block";


    document
    .getElementById(
        "username"
    )
    .value =
    "";


    document
    .getElementById(
        "userInfo"
    )
    .innerHTML =
    "";


    alert(
      "Anda telah logout"
    );

}

  const API_USER =
"/api/users";


async function loadUsers(){


const response =
await fetch(
API_USER
);


const result =
await response.json();


const select =
document
.getElementById(
"userSelect"
);

  async function loadUsers() {

  const select =
    document.getElementById(
      "userSelect"
    );

  const status =
    document.getElementById(
      "loginStatus"
    );


  try {

    status.innerHTML =
      "⏳ Mengambil daftar user...";


    const response =
      await fetch(
        "/api/users"
      );


    const result =
      await response.json();


    console.log(
      "MASTER USER:",
      result
    );


    if (
      !result.success
    ) {

      throw new Error(
        result.message ||
        "Gagal mengambil user"
      );

    }


    select.innerHTML =
      '<option value="">-- Pilih Operator --</option>';


    if (
      !result.users ||
      result.users.length === 0
    ) {

      status.innerHTML =
        "❌ Tidak ada user aktif";

      return;

    }


    result.users.forEach(
      user => {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          JSON.stringify(
            user
          );


        option.textContent =
          user.nama +
          " — " +
          user.role;


        select.appendChild(
          option
        );

      }
    );


    status.innerHTML =
      "✅ Daftar operator siap";


  } catch(error) {

    console.error(error);


    status.innerHTML =
      "❌ Gagal mengambil user: " +
      error.message;

  }

}

  function loginUser() {

  const select =
    document.getElementById(
      "userSelect"
    );


  if (!select.value) {

    alert(
      "Silakan pilih operator terlebih dahulu"
    );

    return;

  }


  const user =
    JSON.parse(
      select.value
    );


  currentUser =
    user;


  localStorage.setItem(
    "operator",
    JSON.stringify(user)
  );


  document
    .getElementById(
      "loginCard"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "userInfo"
    )
    .innerHTML =
      "👤 Operator: <b>" +
      user.nama +
      "</b> (" +
      user.role +
      ")";


  console.log(
    "LOGIN:",
    user
  );

}
