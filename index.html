<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Scan ID Sampel</title>


<script
  src="https://unpkg.com/html5-qrcode">
</script>


<style>

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  font-family:
    Arial,
    sans-serif;

  background:
    #f3f6f9;

}


.header {

  background:
    #0078bd;

  color: white;

  padding: 18px;

  text-align: center;

}


.header h2 {

  margin: 0;

}


.container {

  max-width: 600px;

  margin: auto;

  padding: 15px;

}


.card {

  background: white;

  border-radius: 16px;

  padding: 15px;

  margin-bottom: 15px;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,0.12);

}


#reader {

  width: 100%;

}


.status {

  margin-top: 12px;

  padding: 12px;

  border-radius: 10px;

  background:
    #e8f4fc;

  text-align: center;

  font-weight: bold;

}


.result-card {

  display: none;

}


.label {

  font-size: 12px;

  color:
    #6b7280;

  margin-top: 12px;

}


.value {

  font-size: 17px;

  font-weight: bold;

  margin-top: 3px;

}


.uuid {

  color:
    #0078bd;

  word-break:
    break-all;

}


button {

  width: 100%;

  border: none;

  padding: 14px;

  margin-top: 12px;

  border-radius: 10px;

  font-size: 16px;

  font-weight: bold;

  cursor: pointer;

}


.primary {

  background:
    #0078bd;

  color: white;

}


.secondary {

  background:
    #e5e7eb;

}


.success {

  background:
    #dcfce7;

  color:
    #166534;

}


.error {

  background:
    #fee2e2;

  color:
    #991b1b;

}


#message {

  display: none;

  margin-top: 12px;

  padding: 12px;

  border-radius: 10px;

  text-align: center;

}

</style>

</head>



<body>


<div class="header">

<h2>
📷 Scan ID Sampel
</h2>

</div>



<div class="container">


<div class="card">

<div id="reader"></div>


<div
  id="status"
  class="status">

Menyiapkan kamera...

</div>

</div>



<div
  id="resultCard"
  class="card result-card">


<div class="label">
UUID
</div>

<div
  id="uuid"
  class="value uuid">
-
</div>



<div class="label">
ID Sampel
</div>

<div
  id="idSampel"
  class="value">
-
</div>



<div class="label">
Tanggal
</div>

<div
  id="tanggal"
  class="value">
-
</div>



<div class="label">
Posisi Sampel
</div>

<div
  id="posisi"
  class="value">
-
</div>



<div class="label">
Jenis Pengujian
</div>

<div
  id="pengujian"
  class="value">
-
</div>



<button
  class="primary"
  onclick="simpanData()">

💾 Simpan

</button>



<button
  class="secondary"
  onclick="scanLagi()">

🔄 Scan Berikutnya

</button>


<div id="message"></div>


</div>


</div>



<script>


const API_URL = "/api/sample";


let scanner;

let scannerAktif =
  false;


let currentData =
  null;



window.addEventListener(
  "load",
  function() {

    setTimeout(
      startScanner,
      500
    );

  }
);



async function startScanner() {


const status =
  document.getElementById(
    "status"
  );


try {


scanner =
  new Html5Qrcode(
    "reader"
  );


const config = {

  fps: 12,

  qrbox: {

    width: 250,

    height: 250

  }

};



await scanner.start(


{
  facingMode:
    "environment"
},


config,


async function(decodedText) {


if (!scannerAktif)
  return;


scannerAktif =
  false;


status.innerHTML =
  "✅ QR berhasil dibaca";


try {

  await scanner.stop();

} catch(e) {}


await cariSampel(
  decodedText
);


},


function(errorMessage) {

  // error per-frame
  // tidak perlu ditampilkan

}


);


scannerAktif =
  true;


status.innerHTML =
  "📷 Kamera aktif — arahkan ke QR Code";


}


catch(error) {


console.error(error);


status.innerHTML =
  "❌ Kamera gagal: " +
  error;


}


}



async function cariSampel(uuid) {

  const status =
    document.getElementById("status");


  status.innerHTML =
    "🔍 Mencari data sampel...";


  document.getElementById(
    "uuid"
  ).innerText = uuid;


  try {

    const url =
      API_URL +
      "?uuid=" +
      encodeURIComponent(uuid);


    console.log(
      "Mencari:",
      url
    );


    const response =
      await fetch(url);


    const result =
      await response.json();


    console.log(
      "Hasil API:",
      result
    );


    if (!result.success) {

      status.innerHTML =
        "❌ " +
        (
          result.message ||
          "Sampel tidak ditemukan"
        );

      return;

    }


    currentData =
      result.data;


    document.getElementById(
      "uuid"
    ).innerText =
      currentData.uuid || "-";


    document.getElementById(
      "idSampel"
    ).innerText =
      currentData.idSampel || "-";


    document.getElementById(
      "tanggal"
    ).innerText =
      currentData.tanggal || "-";


    document.getElementById(
      "posisi"
    ).innerText =
      currentData.posisi || "-";


    document.getElementById(
      "pengujian"
    ).innerText =
      currentData.pengujian || "-";


    document.getElementById(
      "resultCard"
    ).style.display =
      "block";


    status.innerHTML =
      "✅ Sampel ditemukan";


  } catch (error) {

    console.error(
      "API ERROR:",
      error
    );


    status.innerHTML =
      "❌ Gagal mengambil data: " +
      error.message;

  }

}


currentData =
  result.data;



document.getElementById(
  "uuid"
).innerText =
  currentData.uuid;


document.getElementById(
  "idSampel"
).innerText =
  currentData.idSampel;


document.getElementById(
  "tanggal"
).innerText =
  currentData.tanggal;


document.getElementById(
  "posisi"
).innerText =
  currentData.posisi;


document.getElementById(
  "pengujian"
).innerText =
  currentData.pengujian;



document.getElementById(
  "resultCard"
).style.display =
  "block";


status.innerHTML =
  "✅ Sampel ditemukan";


}


catch(error) {


console.error(error);


status.innerHTML =
  "❌ Gagal mengambil data";


}


}



async function simpanData() {


if (!currentData)
  return;


const message =
  document.getElementById(
    "message"
  );


message.style.display =
  "block";


message.className =
  "";


message.innerHTML =
  "Menyimpan...";


try {


const payload = {

  action:
    "saveScan",

  ...currentData

};



const response =
  await fetch(

    API_URL,

    {

      method:
        "POST",

      body:
        JSON.stringify(
          payload
        )

    }

  );


const result =
  await response.json();



if (result.success) {


message.className =
  "success";


message.innerHTML =
  "✅ Data berhasil disimpan";


}


else {


message.className =
  "error";


message.innerHTML =
  "❌ " +
  result.message;


}


}


catch(error) {


message.className =
  "error";


message.innerHTML =
  "❌ Gagal menyimpan data";


}


}



async function scanLagi() {


currentData =
  null;


document.getElementById(
  "resultCard"
).style.display =
  "none";


document.getElementById(
  "message"
).style.display =
  "none";


scanner =
  null;


setTimeout(
  startScanner,
  400
);


}


</script>


</body>

</html>
